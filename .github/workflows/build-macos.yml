name: Build macOS package

# Builds the self-contained macOS (Apple Silicon) .app + DMG via
# build_dmg.command. Unsigned: no signing identity or secret is used.
# Never publishes on its own; release.yml attaches artifacts to a DRAFT
# release that the maintainer publishes by hand.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      # NOTE: pin to commit SHAs before enabling on a public repo.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview pyobjc mss numpy pillow pynput certifi cyclonedx-bom

      - name: Build .app + DMG
        run: PYTHON=python ./build_dmg.command

      - name: Package-content scan (branding / endpoints / secrets)
        run: |
          bad='Prospectors Plus|ProspectorsPlus|PPLUS-|ip-api\.com|prospectorsplus\.github\.io|discord\.com/api/webhooks/[0-9]'
          # shipped docs may reference the old name in migration/history
          # context; the tracked-tree gate (public_release_tests.py) already
          # enforces line-level context rules on them
          if grep -RInE "$bad" "dist/Prospector Lite.app/Contents/Resources" 2>/dev/null \
               | grep -v Binary \
               | grep -vE "/(README|PRIVACY|SECURITY|THIRD_PARTY_NOTICES)\.md:"; then
            echo "forbidden strings in package"; exit 1
          fi
          echo "package content clean"

      - name: Smoke test (frozen app answers --capabilities offline)
        run: |
          out="$('dist/Prospector Lite.app/Contents/MacOS/Prospector Lite' --capabilities)"
          test "${#out}" -gt 10 && echo "smoke ok"

      - name: SBOM (CycloneDX, build environment)
        run: python -m cyclonedx_py environment --of JSON -o dist/sbom-macos.cdx.json

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 ProspectorLite-*.dmg > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prospector-lite-macos
          path: |
            dist/ProspectorLite-*.dmg
            dist/SHA256SUMS-macos.txt
            dist/sbom-macos.cdx.json
          retention-days: 30
