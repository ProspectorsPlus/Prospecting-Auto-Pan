name: Build Windows package

# Builds the self-contained Windows x64 installer + portable ZIP.
# - No secrets are read or injected: the shipped config is exactly the
#   tracked, sanitized windows/prospecting_config.json.
# - Never publishes on its own; release.yml attaches artifacts to a DRAFT
#   release that the maintainer publishes by hand.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      # Public source repository, stamped into build_info.json so the in-app
      # View Code links resolve to the exact build commit.
      PP_PROJECT_URL: https://github.com/ProspectorsPlus/Prospecting-Auto-Pan
      # The `secrets` context cannot be used in step `if:` expressions;
      # hoist the presence check into job env once.
      HAVE_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_B64 != '' }}
    steps:
      # NOTE: pin to commit SHAs before enabling on a public repo.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview pythonnet mss numpy pillow certifi cyclonedx-bom

      - name: Stamp build identity + trust manifest
        run: |
          python -c "import json,os,datetime,re;v=re.search(r'VERSION\s*=\s*\"([^\"]+)\"',open('prospecting_app.py',encoding='utf-8').read()).group(1);json.dump({'commit':os.environ['GITHUB_SHA'],'date':datetime.date.today().isoformat(),'version':v,'dirty':False,'package':'windows','project_url':os.environ.get('PP_PROJECT_URL',''),'signed':False,'notarized':False},open('build_info.json','w'))"
          python ..\lite_trust.py --emit trust_manifest.json

      - name: Read app version into env
        shell: pwsh
        run: |
          $v = (Select-String -Path prospecting_app.py -Pattern 'VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "version: $v"

      - name: Make icon.ico
        run: python -c "from PIL import Image;Image.open('icon.png').convert('RGBA').save('icon.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build app (PyInstaller)
        run: python -m PyInstaller --noconfirm prospecting.spec

      - name: Package-content scan (branding / endpoints / secrets)
        shell: pwsh
        run: |
          # 'ProspectorsPlus' (the org slug) and the project website host are
          # sanctioned: they are the official source URL stamped into
          # build_info.json and referenced by shipped docs. The spaced
          # old-brand name and the removed endpoints stay banned.
          $bad = @('Prospectors Plus','PPLUS-','ip-api.com',
                   'discord.com/api/webhooks/1')
          $hits = @()
          # shipped docs may reference the old name in migration/history
          # context; the tracked-tree gate (public_release_tests.py) already
          # enforces line-level context rules on them
          $docs = @('README.md','PRIVACY.md','SECURITY.md','THIRD_PARTY_NOTICES.md')
          Get-ChildItem -Recurse "dist/Prospector Lite" -Include *.json,*.py,*.txt,*.md |
            Where-Object { $docs -notcontains $_.Name } | ForEach-Object {
            $t = Get-Content $_.FullName -Raw
            foreach ($b in $bad) { if ($t -like "*$b*") { $hits += "$($_.Name): $b" } }
          }
          if ($hits) { $hits | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Output "package content clean"

      - name: Smoke test (frozen exe answers --capabilities offline)
        shell: pwsh
        run: |
          $out = & "dist/Prospector Lite/Prospector Lite.exe" --capabilities | Out-String
          if ($LASTEXITCODE -ne 0 -or $out.Length -lt 10) { Write-Error "capabilities probe failed"; exit 1 }
          Write-Output "smoke ok"

      # First automated end-to-end acceptance of the frozen build (version
      # identity, isolated --capabilities, bounded first boot, AppData
      # convention, bundle-content scan, static DPI check). The script
      # refuses elevated shells and prints the manual DPI checklist; it has
      # never run on real Windows before this workflow does it.
      - name: Acceptance probes (windows_acceptance.ps1)
        shell: pwsh
        run: pwsh -File ../packaging/windows_acceptance.ps1 "dist\Prospector Lite"

      # Authenticode signing readiness: runs ONLY when the repository has the
      # WINDOWS_CERT_PFX_B64 + WINDOWS_CERT_PASSWORD secrets configured. No
      # certificate is committed; unsigned builds are produced (and clearly
      # labelled unsigned in-app) when the secrets are absent.
      - name: Sign exe (optional, needs WINDOWS_CERT_PFX_B64 secret)
        if: ${{ env.HAVE_WIN_CERT == 'true' }}
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx",[Convert]::FromBase64String($env:PFX_B64))
          & signtool sign /f cert.pfx /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist/Prospector Lite/Prospector Lite.exe"
          & signtool verify /pa "dist/Prospector Lite/Prospector Lite.exe"
          Remove-Item cert.pfx

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Sign installer (optional, needs WINDOWS_CERT_PFX_B64 secret)
        if: ${{ env.HAVE_WIN_CERT == 'true' }}
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx",[Convert]::FromBase64String($env:PFX_B64))
          & signtool sign /f cert.pfx /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "Output/ProspectorLite-$env:APP_VERSION-Windows-x64-Setup.exe"
          & signtool verify /pa "Output/ProspectorLite-$env:APP_VERSION-Windows-x64-Setup.exe"
          Remove-Item cert.pfx

      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/Prospector Lite" -DestinationPath "Output/ProspectorLite-$env:APP_VERSION-Windows-x64-Portable.zip"

      - name: SBOM (CycloneDX, build environment)
        run: python -m cyclonedx_py environment --of JSON -o Output/sbom-windows.cdx.json

      - name: Checksums
        shell: pwsh
        run: |
          cd Output
          Get-FileHash ProspectorLite-*-Setup.exe, ProspectorLite-*-Portable.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prospector-lite-windows
          path: |
            windows/Output/ProspectorLite-*-Setup.exe
            windows/Output/ProspectorLite-*-Portable.zip
            windows/Output/SHA256SUMS-windows.txt
            windows/Output/sbom-windows.cdx.json
          retention-days: 30
