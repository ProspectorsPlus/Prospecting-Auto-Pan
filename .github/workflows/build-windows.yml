name: Build Windows package

# Builds the self-contained Windows x64 installer + portable ZIP.
# - No secrets are read or injected: the shipped config is exactly the
#   tracked, sanitized windows/prospecting_config.json.
# - Never publishes on its own; release.yml attaches artifacts to a DRAFT
#   release that the maintainer publishes by hand.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      # NOTE: pin to commit SHAs before enabling on a public repo.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview pythonnet mss numpy pillow cyclonedx-bom

      - name: Stamp build identity
        run: python -c "import json,os,datetime;json.dump({'commit':os.environ['GITHUB_SHA'],'date':datetime.date.today().isoformat()},open('build_info.json','w'))"

      - name: Make icon.ico
        run: python -c "from PIL import Image;Image.open('icon.png').convert('RGBA').save('icon.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build app (PyInstaller)
        run: python -m PyInstaller --noconfirm prospecting.spec

      - name: Package-content scan (branding / endpoints / secrets)
        shell: pwsh
        run: |
          $bad = @('Prospectors Plus','ProspectorsPlus','PPLUS-','ip-api.com',
                   'prospectorsplus.github.io','discord.com/api/webhooks/1')
          $hits = @()
          Get-ChildItem -Recurse "dist/Prospector Lite" -Include *.json,*.py,*.txt,*.md | ForEach-Object {
            $t = Get-Content $_.FullName -Raw
            foreach ($b in $bad) { if ($t -like "*$b*") { $hits += "$($_.Name): $b" } }
          }
          if ($hits) { $hits | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Output "package content clean"

      - name: Smoke test (frozen exe answers --capabilities offline)
        shell: pwsh
        run: |
          $out = & "dist/Prospector Lite/Prospector Lite.exe" --capabilities | Out-String
          if ($LASTEXITCODE -ne 0 -or $out.Length -lt 10) { Write-Error "capabilities probe failed"; exit 1 }
          Write-Output "smoke ok"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/Prospector Lite" -DestinationPath "Output/ProspectorLite-portable-win64.zip"

      - name: SBOM (CycloneDX, build environment)
        run: python -m cyclonedx_py environment --of JSON -o Output/sbom-windows.cdx.json

      - name: Checksums
        shell: pwsh
        run: |
          cd Output
          Get-FileHash ProspectorLiteSetup.exe, ProspectorLite-portable-win64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prospector-lite-windows
          path: |
            windows/Output/ProspectorLiteSetup.exe
            windows/Output/ProspectorLite-portable-win64.zip
            windows/Output/SHA256SUMS-windows.txt
            windows/Output/sbom-windows.cdx.json
          retention-days: 30
