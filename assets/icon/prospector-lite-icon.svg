<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Prospector Lite app icon: original geometric faceted diamond on a
       dark tile. Master source for packaging/make_icon.py (the PNG/ICNS/ICO
       pipeline renders the same geometry with PIL). -->
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="229"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#161410"/>
    <rect x="6" y="6" width="1012" height="1012" rx="223" fill="none"
          stroke="#241d15" stroke-width="6"/>
    <g transform="translate(184.32,148.68) scale(27.3)">
      <polygon points="6.5,4 17.5,4 15.4,9.2 8.6,9.2" fill="#f6e7c8"/>
      <polygon points="6.5,4 8.6,9.2 2.5,9.2" fill="#e8cf8f"/>
      <polygon points="17.5,4 21.5,9.2 15.4,9.2" fill="#c9a24f"/>
      <polygon points="2.5,9.2 8.6,9.2 12,21" fill="#d9a441"/>
      <polygon points="8.6,9.2 15.4,9.2 12,21" fill="#f0d9a0"/>
      <polygon points="15.4,9.2 21.5,9.2 12,21" fill="#b8933f"/>
    </g>
  </g>
</svg>
