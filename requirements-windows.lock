# Hashed dependency lock for Windows.
#
# UNPOPULATED ON PURPOSE.
#
# A hashed lock pins the exact wheels for one platform. Generating this file on
# macOS would resolve macOS wheels and macOS hashes, producing a lock that
# either fails on Windows or - worse - looks authoritative while being wrong.
# Plan section 18.8 forbids claiming Windows artifacts from a Mac, so this file
# stays empty of requirements until it is generated on Windows.
#
# Generate it there, with a verified interpreter:
#
#   py -3.13 -m venv .venv
#   .venv\Scripts\python -m pip install pip-tools
#   .venv\Scripts\python -m piptools compile --generate-hashes --strip-extras ^
#       --output-file requirements-windows.lock pyproject.toml
#
# Then commit the result. packaging/build_windows.ps1 refuses to build until
# this file actually contains pinned requirements.
#
# STATUS: pending (STATUS.md, phase 6).
